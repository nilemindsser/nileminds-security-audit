rules:
  - id: nmsa.python.eval-use
    languages: [python]
    severity: ERROR
    message: "Review unsafe eval execution and user-controlled inputs."
    pattern: eval(...)
  - id: nmsa.python.exec-use
    languages: [python]
    severity: ERROR
    message: "Review dynamic exec execution."
    pattern: exec(...)
  - id: nmsa.python.subprocess-shell
    languages: [python]
    severity: WARNING
    message: "Review subprocess execution with shell=True."
    pattern: subprocess.$FUNC(..., shell=True, ...)
